[package]
name = "photo-splitter"
description = "Splits a directory of time-ordered photos into per-shoot folders using QR-code marker frames, writing configurable YAML metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
categories = ["command-line-utilities"]

[[bin]]
name = "photo-splitter"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = "0.4"
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "bmp", "webp"] }
rqrr = "0.11"
rayon = "1"
dirs = "7"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
qrcode = "0.14"

[build-dependencies]
bindgen = "0.71"
pkg-config = "0.3"
