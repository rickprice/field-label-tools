# Example extra-fields config for label-qr-gui.
#
# Run with: label-qr-gui --config fields.example.toml
#
# Each [[set]] is one named "Metadata Set" selectable from the GUI's
# dropdown; each set's [[set.field]] entries add one text field below
# the built-in Client/Project/Location/ID/Name fields, embedded in the
# QR code's JSON payload under "extra". By default a field's value is
# kept across "Next" (like Project/Location); set reset_on_next = true
# to clear it instead (like Name). Set multiline = true for a field
# that commonly holds more than one line of text (a list of names, a
# multi-line address, etc.) -- it gets a larger text area instead of a
# single-line box.
#
# A "Plain" set (no extra fields) is always available even if you don't
# define one yourself -- see ensure_plain_field_set() in main.rs.

[[set]]
name = "Survey"

[[set.field]]
name = "Surveyor"

[[set.field]]
name = "Permit Number"

[[set.field]]
name = "Notes"
reset_on_next = true

[[set]]
name = "Church Photos"

[[set.field]]
name = "People"
multiline = true

[[set.field]]
name = "Address"
multiline = true

[[set.field]]
name = "Phone Numbers"
multiline = true
